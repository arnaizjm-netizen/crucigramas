    ctx.fillStyle = "#555555";
    for (var i = 0; i < N; i++) {
      ctx.fillText(String(i + 1), pad + i * cell + cell / 2, pad / 2);
      ctx.fillText(String(i + 1), pad / 2, pad + i * cell + cell / 2);
    }
    for (var r = 0; r < N; r++) {
      for (var c = 0; c < N; c++) {
        var x = pad + c * cell, y = pad + r * cell;
        if (DATA.black[r][c]) {
          ctx.fillStyle = "#111111";
          ctx.fillRect(x, y, cell, cell);
        } else {
          ctx.fillStyle = "#ffffff";
          ctx.fillRect(x, y, cell, cell);
          ctx.strokeStyle = "#bbbbbb";
          ctx.lineWidth = 1;
          ctx.strokeRect(x + 0.5, y + 0.5, cell - 1, cell - 1);
          ctx.fillStyle = "#2f8f3f";
          ctx.font = "bold 18px sans-serif";
          ctx.fillText(state.grid[r][c] || "", x + cell / 2, y + cell / 2 + 1);
        }
      }
    }
    canvas.toBlob(function (blob) {
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      var safeName = DATA.name.replace(/[^a-z0-9]+/gi, "_");
      a.href = url;
      a.download = safeName + "_resuelto.png";
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
    });
  });

  // ---------- toast ----------
  var toastEl = document.getElementById("toastEl");
  var toastTimeout = null;
  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimeout);
    toastTimeout = setTimeout(function () { toastEl.classList.remove("show"); }, 1800);
  }

  // ---------- eventos de GoatCounter (con reintento por si count.js aun no ha cargado) ----------
  function gcEvent(suffix, title, triesLeft) {
    if (window.goatcounter && window.goatcounter.count) {
      window.goatcounter.count({
        path: location.pathname.replace(/\/$/, "") + suffix,
        title: title,
        event: true,
      });
      return;
    }
    triesLeft = triesLeft === undefined ? 10 : triesLeft;
    if (triesLeft <= 0) return;
    setTimeout(function () { gcEvent(suffix, title, triesLeft - 1); }, 200);
  }

  // ---------- copiar definicion al portapapeles ----------
  document.querySelector(".defs-panel").addEventListener("click", function () {
    if (!currentDefSeg) return;
    var preamble = "Voy a darte una definición de un crucigrama. Échame una mano sin revelarme la solución.";
    var text = preamble + "\n\n" + currentDefSeg.clue + " (número de letras: " + currentDefSeg.cells.length + ")";
    if (!navigator.clipboard || !navigator.clipboard.writeText) {
      showToast("No se pudo copiar");
      return;
    }
    navigator.clipboard.writeText(text).then(function () {
      showToast("Copiado ✓");
    }).catch(function () {
      showToast("No se pudo copiar");
    });
  });

  // ---------- eventos de casillas ----------
  for (var r2 = 0; r2 < N; r2++) {
    for (var c2 = 0; c2 < N; c2++) {
      (function (r, c) {
        var inp = inputs[r][c];
        if (!inp) return;

        // evita el menu de Copiar/Pegar/Buscar que iOS muestra al seleccionar texto
        inp.addEventListener("contextmenu", function (e) { e.preventDefault(); });

        inp.addEventListener("pointerdown", function () {
          if (document.activeElement === inp && state.selR === r && state.selC === c) {
            var other = state.dir === "H" ? "V" : "H";
            var segId = segIdFor(r, c, other);
            if (segId) {
              state.dir = other;
              applyHighlight();
              updateDefs();
            }
          }
        });

        inp.addEventListener("focus", function () {
          if (forcedDirForNextFocus) {
            selectCell(r, c, forcedDirForNextFocus, true);
          } else {
            selectCell(r, c, state.dir);
          }
          inp.select();
          if (window.innerWidth < 700) {
            setTimeout(function () {
              inp.scrollIntoView({ block: "center", inline: "center", behavior: "smooth" });
            }, 100);
          }
        });

        inp.addEventListener("input", function () {
          var raw = inp.value.replace(/[^A-Za-zÑñ]/g, "");
          var letter = raw.slice(-1).toUpperCase();
          inp.value = letter;
          state.grid[r][c] = letter;

          if (state.checking) {
            exitCheckMode();
            clearCheckStyles();
          }

          if (letter) {
            var hasAny = state.grid.some(function (row) { return row.some(function (v) { return v; }); });
            if (hasAny) ensureTimerRunning();
            if (!state.started) {
              state.started = true;
              gcEvent("-empezado", "Crucigrama empezado");
            }
            if (!state.firstWordDone) {
              var hSeg = DATA.cellSegH[r][c], vSeg = DATA.cellSegV[r][c];
              if (isSegmentComplete(hSeg) || isSegmentComplete(vSeg)) {
                state.firstWordDone = true;
                gcEvent("-primera_palabra", "Primera palabra resuelta");
              }
            }
            var next = neighborInSegment(r, c, state.dir, 1);
            if (next) moveTo(next[0], next[1], state.dir);
          }

          saveState();

          if (isGridFull() && isGridAllCorrect()) {
            finishGame();
          }
        });

        inp.addEventListener("keydown", function (e) {
          if (state.finished) return;
          switch (e.key) {
            case "Backspace": {
              e.preventDefault();
              if (state.checking) {
                exitCheckMode(); clearCheckStyles();
              }
              if (state.grid[r][c]) {
                state.grid[r][c] = "";
                inp.value = "";
                saveState();
              } else {
                var prev = neighborInSegment(r, c, state.dir, -1);
                if (prev) {
                  state.grid[prev[0]][prev[1]] = "";
                  if (inputs[prev[0]][prev[1]]) inputs[prev[0]][prev[1]].value = "";
                  moveTo(prev[0], prev[1], state.dir);
                  saveState();
                }
              }
              break;
            }
            case "Delete": {
              e.preventDefault();
              state.grid[r][c] = "";
              inp.value = "";
              saveState();
              break;
            }
            case "Tab": {
              e.preventDefault();
              var order = state.dir === "H" ? segOrderH : segOrderV;
              var curId = segIdFor(r, c, state.dir);
              var idx = order.indexOf(curId);
              var delta = e.shiftKey ? -1 : 1;
              var nextIdx = (idx + delta + order.length) % order.length;
              var nextSeg = segOf(order[nextIdx]);
              var target = nextSeg.cells[0];
              moveTo(target[0], target[1], state.dir, true);
              break;
            }
            case "ArrowLeft": case "ArrowRight": case "ArrowUp": case "ArrowDown": {
              e.preventDefault();
              var dir = (e.key === "ArrowLeft" || e.key === "ArrowRight") ? "H" : "V";
              var delta = (e.key === "ArrowRight" || e.key === "ArrowDown") ? 1 : -1;
              var nr = r + (dir === "V" ? delta : 0);
              var nc = c + (dir === "H" ? delta : 0);
              if (nr >= 0 && nr < N && nc >= 0 && nc < N && inputs[nr][nc]) {
                moveTo(nr, nc, dir, true);
              }
              break;
            }
          }
        });
      })(r2, c2);
    }
  }

  // ---------- estado inicial al cargar ----------
  (function initFromLoadedState() {
    var hasAny = state.grid.some(function (row) { return row.some(function (v) { return v; }); });
    if (state.finished) {
      finishGame();
    } else if (hasAny) {
      ensureTimerRunning();
    }
    renderTimer(state.elapsedMs);
    selectCell(state.selR, state.selC, state.dir);
  })();

})();
</script>
</body>
</html>
